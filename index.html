<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EE4D2D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Palangka Raya DC · Work Permit</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
const { S, $, esc, fd, today, shiftTag, when, toast, api, download, saveSession, logout, watermark, t, typeName, stLabel, actLabel, roleName, prefsBar, SH, ST_CLS, BACKEND_ROLES } = App;

const RANGE = ['cuti', 'sakit'];          // rentang tanggal
const SHIFT_TYPES = ['sakit', 'izin'];    // hanya ini yang memakai shift
const KINDS = ['cuti', 'sakit', 'tukar', 'tambah', 'izin'];
const V = { tab: 'form', type: 'cuti', note: '', photos: [], reqs: [], sched: [] };
// Operator hanya boleh Cuti dan Sakit.
const kindsFor = () => (S.user?.kind === 'operator' ? ['cuti', 'sakit'] : KINDS);

/* ---------- Login ---------- */
function viewLogin() {
  return `<section class="auth">
    <div class="auth-top">${prefsBar()}</div>
    <div class="brand-mark">PKY</div>
    <h1>${t('app_name')}</h1>
    <form class="sheet" onsubmit="doLogin(event)">
      <p class="meta">${t('login_sub_fe')}</p>
      <label>${t('login_id')}<input name="login" autocomplete="username" autocapitalize="characters" required></label>
      <label>${t('password')}<input name="pin" type="password" autocomplete="current-password" required></label>
      <button class="btn">${t('login_btn')}</button>
    </form></section>`;
}

async function doLogin(e) {
  e.preventDefault();
  const g = (n) => e.target.elements[n].value;
  try {
    const d = await api('login', { id: g('login').trim(), pin: g('pin') });
    saveSession(d.token, d.user);
    V.tab = 'form';
    await load();
  } catch (x) { toast(x.message); }
}

/* ---------- Work Permit (form) ---------- */
function setType(k) { V.type = k; render(); }

function viewForm() {
  if (!kindsFor().includes(V.type)) V.type = 'cuti';
  const tp = V.type, now = today();
  const sel = [1, 2, 3].map((n) => `<option value="${n}">Shift ${n}</option>`).join('');
  let dates;
  if (tp === 'tukar') {
    dates = `<div class="swap">
        <label class="swap-card"><span>${t('swap_from')}</span><input type="date" name="from" min="${now}" value="${now}" required></label>
        <div class="swap-arrow" aria-hidden="true">⇄</div>
        <label class="swap-card"><span>${t('swap_to')}</span><input type="date" name="to" min="${now}" required></label>
      </div>
      <p class="meta" style="margin-top:6px">${t('swap_hint')}</p>`;
  } else if (RANGE.includes(tp)) {
    dates = `<div class="row">
        <label>${t('start')}<input type="date" name="from" min="${now}" value="${now}" required></label>
        <label>${t('end')}<input type="date" name="to" min="${now}" value="${now}" required></label></div>`;
  } else {
    dates = `<label>${t('date')}<input type="date" name="from" min="${now}" value="${now}" required></label>`;
  }
  const photoLabel = tp === 'sakit' ? t('photo_doctor') : t('photo_support');
  return `<div class="hero"><h2>${t('tab_work')}</h2></div>
  <div class="kinds">${kindsFor().map((k) => `<button type="button" class="kind ${k === tp ? 'on' : ''}" onclick="setType('${k}')"><b>${typeName(k)}</b><span>${t('hint_' + k)}</span></button>`).join('')}</div>
  <form class="sheet" onsubmit="send(event)">
    <div class="who"><span>${esc(S.user.name)}</span><span>Ops ${esc(S.user.ops || '-')}</span></div>
    ${dates}
    ${SHIFT_TYPES.includes(tp) ? `<label>${t('shift')}<select name="shift">${sel}</select></label>` : ''}
    <label>${t('reason')}<textarea name="note" required oninput="V.note=this.value">${esc(V.note)}</textarea></label>
    <div class="field">
      <span class="lbl">${photoLabel} ${tp === 'sakit' ? t('photo_hint_req') : t('photo_hint')}</span>
      <input id="fi" type="file" accept="image/*" multiple hidden onchange="addPh(this)">
      <button type="button" class="ghost" onclick="$('#fi').click()">${t('upload_photo')}</button>
      <div class="thumbs">${V.photos.map((p, i) => `<div><img src="${p}" alt=""><button type="button" onclick="rmPh(${i})" aria-label="×">×</button></div>`).join('')}</div>
    </div>
    <button class="btn">${t('btn_send')}</button>
  </form>`;
}

async function send(e) {
  e.preventDefault();
  const g = (n) => e.target.elements[n]?.value;
  const body = {
    type: V.type,
    from: g('from'),
    to: g('to') || g('from'),
    shift: g('shift'),
    note: g('note'),
    photos: V.photos,
  };
  if (body.type === 'tukar' && body.from === body.to) return toast(t('err_same_date'));
  if (body.type === 'sakit' && !V.photos.length) return toast(t('err_photo_sick'));
  try {
    await api('requests', body);
    toast(t('toast_sent'));
    V.photos = [];
    V.note = '';
    V.tab = 'list';
    await load();
  } catch (x) { toast(x.message); }
}

/* ---------- Foto ---------- */
function shrink(f) {
  return new Promise((ok, no) => {
    const im = new Image(), url = URL.createObjectURL(f);
    im.onload = () => {
      const k = Math.min(1, 1100 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => no(new Error('Foto tidak bisa dibaca'));
    im.src = url;
  });
}
async function addPh(el) {
  for (const f of [...el.files]) {
    if (V.photos.length >= 3) { toast('Maks. 3 foto'); break; }
    try { V.photos.push(await shrink(f)); } catch (x) { toast(x.message); }
  }
  el.value = '';
  render();
}
function rmPh(i) { V.photos.splice(i, 1); render(); }

async function showPh(id) {
  try {
    const p = await api('photos/' + id);
    if (!p.length) return toast(t('no_photo'));
    const o = document.createElement('div');
    o.id = 'ov';
    o.onclick = () => o.remove();
    o.innerHTML = p.map((x) => `<img src="${x}" alt="">`).join('') +
      `<p class="ovw">${esc(S.user.name)} · Ops ${esc(S.user.ops || S.user.id)} · ${t('close_hint')}</p>`;
    document.body.appendChild(o);
  } catch (x) { toast(x.message); }
}

/* ---------- Histori ---------- */
function waText(r) {
  const lines = [
    `*Pengajuan ${typeName(r.type)}*`,
    `Nama: ${r.name}`,
    `Ops ID: ${r.ops}`,
    `Tanggal: ${when(r)}`,
  ];
  if (r.shift) lines.push(`Shift: ${r.shift}`);
  lines.push(`Alasan: ${r.note}`, `Status: ${stLabel(r.status)}`);
  r.log.forEach((l) => lines.push(`${l.by} ${actLabel(l.action)}${l.note ? ' — ' + l.note : ''}`));
  return lines.join('\n');
}
function reqCard(r) {
  const cls = ST_CLS[r.status] || '';
  return `<article class="item ${cls}">
    <div class="row1">
      <div><h3>${typeName(r.type)}</h3><div class="meta">${when(r)}</div></div>
      <span class="st ${cls}">${stLabel(r.status)}</span>
    </div>
    ${r.shift ? `<div class="meta" style="margin-top:6px">${shiftTag(r.shift)}</div>` : ''}
    <p>${esc(r.note)}</p>
    ${r.photos ? `<button class="ghost sm" onclick="showPh('${r.id}')">${t('view_photos', { n: r.photos })}</button>` : ''}
    ${r.log.map((l) => `<div class="log">${esc(l.by)} ${actLabel(l.action)}${l.note ? ' — ' + esc(l.note) : ''}</div>`).join('')}
    <div class="act"><a class="ghost sm wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(waText(r))}">${t('btn_wa')}</a></div>
    ${r.status === 'menunggu_tl' ? `<div class="act"><button class="btn sm danger" onclick="cancelReq('${r.id}')">${t('btn_cancel')}</button></div>` : ''}
  </article>`;
}
async function cancelReq(id) {
  if (!confirm(t('cancel_confirm'))) return;
  try {
    await api('cancel', { id });
    toast(t('toast_cancelled'));
    await load();
  } catch (x) { toast(x.message); }
}
function viewList() {
  return `<h2>${t('tab_hist')}</h2>${V.reqs.length ? V.reqs.map(reqCard).join('') : `<div class="empty">${t('empty_hist')}</div>`}`;
}

/* ---------- Jadwal (unduh saja) ---------- */
function viewSched() {
  return `<h2>${t('sched_head')}</h2>
  <p class="meta">${t('sched_hint')}</p>
  ${V.sched.length ? V.sched.map((s) => `<article class="item">
      <div class="row1"><div><h3>${esc(s.title)}</h3><div class="meta">${esc(s.name)} · ${t('uploaded_on')} ${fd(s.created.slice(0, 10))}</div></div></div>
      <button class="btn sm" style="margin-top:10px" data-id="${s.id}" data-name="${esc(s.name)}" onclick="dl(this)">${t('btn_download')}</button>
    </article>`).join('') : `<div class="empty">${t('sched_empty')}</div>`}`;
}
async function dl(el) {
  try { await download(el.dataset.id, el.dataset.name); toast(t('toast_downloaded')); }
  catch (x) { toast(x.message); }
}

function viewTutorial() {
  const c = TUT[App.prefs.lang] || TUT.id;
  return `<h2>${c.title}</h2><p class="meta" style="margin-bottom:8px">${c.lead}</p>
  ${c.sections.map((sec) => `<section class="sheet">
      <h3>${sec.h}</h3>
      ${sec.flow
        ? `<div class="flow">${sec.steps.map((s, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<span class="fstep">${s}</span>`).join('')}</div>${sec.note ? `<p class="meta" style="margin-top:10px">${sec.note}</p>` : ''}`
        : `<ol class="steps">${sec.steps.map((s) => `<li>${s}</li>`).join('')}</ol>`}
    </section>`).join('')}`;
}

/* ---------- Kerangka ---------- */
function render() {
  const u = S.user;
  if (!u) { $('#app').innerHTML = viewLogin(); return; }
  const items = [['form', t('tab_work')], ['list', t('tab_hist')], ['sched', t('tab_sched')], ['tutorial', t('tab_tutorial')]].map(([k, label]) => ({ k, label }));
  const body = V.tab === 'form' ? viewForm() : V.tab === 'list' ? viewList() : V.tab === 'sched' ? viewSched() : viewTutorial();
  const link = BACKEND_ROLES.includes(u.role) ? { href: '/backend/', label: t('backend') } : null;
  $('#app').innerHTML = App.shell({ u, items, active: V.tab, link }) + `<main>${body}</main>`;
  watermark(u);
}

async function go(k) {
  V.tab = k;
  if (k === 'list' || k === 'sched') return load();
  render();
}

async function load() {
  try { saveSession(S.tok, (await api('me')).user); } catch (x) { /* data sesi tetap dipakai */ }
  try { V.reqs = (await api('requests?scope=mine')).requests; } catch (x) { toast(x.message); }
  try { V.sched = (await api('jadwal')).items; } catch (x) { toast(x.message); }
  render();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
S.user ? load() : render();
</script>
</body>
</html>
