<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EE4D2D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Palangka Raya DC · Pengajuan Karyawan</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
const { S, $, esc, fd, today, shiftTag, when, toast, api, saveSession, logout, watermark, SH, T, ST, ACT, ROLE, BACKEND_ROLES } = App;
const RANGE = ['cuti', 'sakit'];        // rentang tanggal
const SHIFT_TYPES = ['sakit', 'izin'];  // hanya ini yang memakai pilihan shift
const KIND_HINT = {
  cuti: 'Libur pada rentang tanggal',
  sakit: 'Tidak masuk karena sakit',
  tukar: 'Tukar tanggal kerja dengan rekan',
  tambah: 'Menambah hari kerja',
  izin: 'Tidak bisa hadir pada shift tertentu',
};
const V = { tab: 'form', type: 'cuti', note: '', photos: [], reqs: [] };

/* ---------- Login ---------- */
function viewLogin() {
  return `<section class="auth"><div class="brand-mark">PKY</div><form class="sheet" onsubmit="doLogin(event)">
    <h1>Palangka Raya DC</h1>
    <p class="meta">Masuk dengan ID atau Ops ID serta password yang terdaftar.</p>
    <label>ID atau Ops ID<input name="login" autocomplete="username" autocapitalize="characters" required></label>
    <label>Password<input name="pin" type="password" autocomplete="current-password" required></label>
    <button class="btn">Masuk</button>
  </form></section>`;
}

async function doLogin(e) {
  e.preventDefault();
  const g = (n) => e.target.elements[n].value;
  try {
    const d = await api('login', { id: g('login').trim(), pin: g('pin') });
    saveSession(d.token, d.user);
    V.tab = 'form';
    await load();
  } catch (x) {
    toast(x.message);
  }
}

/* ---------- Form pengajuan ---------- */
function setType(t) { V.type = t; render(); }

function viewForm() {
  const t = V.type, u = S.user;
  const hasRange = RANGE.includes(t);
  const sel = [1, 2, 3].map((n) => `<option value="${n}">Shift ${n} · ${SH[n]}</option>`).join('');
  const now = today();
  let dates;
  if (t === 'tukar') {
    dates = `<div class="row">
      <label>Tanggal kerja yang ditukar<input type="date" name="from" min="${now}" value="${now}" required></label>
      <label>Tanggal pengganti<input type="date" name="to" min="${now}" value="${now}" required></label></div>`;
  } else if (hasRange) {
    dates = `<div class="row">
      <label>Mulai<input type="date" name="from" min="${now}" value="${now}" required></label>
      <label>Sampai<input type="date" name="to" min="${now}" value="${now}" required></label></div>`;
  } else {
    dates = `<label>Tanggal<input type="date" name="from" min="${now}" value="${now}" required></label>`;
  }
  const noteLabel = t === 'cuti' ? 'Alasan cuti' : t === 'sakit' ? 'Keluhan' : 'Alasan';
  return `<h2>Buat pengajuan</h2>
  <div class="kinds">${Object.entries(T).map(([k, n]) => `<button type="button" class="kind ${k === t ? 'on' : ''}" onclick="setType('${k}')"><b>${n}</b><span>${KIND_HINT[k]}</span></button>`).join('')}</div>
  <form class="sheet" onsubmit="send(event)">
    <div class="who"><span>${esc(u.name)}</span><span>Ops ${esc(u.ops || '-')}</span></div>
    ${dates}
    ${SHIFT_TYPES.includes(t) ? `<label>Shift<select name="shift">${sel}</select></label>` : ''}
    ${t === 'tukar' ? `<label>Nama rekan yang menukar<input name="partner" required></label>` : ''}
    <label>${noteLabel}<textarea name="note" required oninput="V.note=this.value">${esc(V.note)}</textarea></label>
    <div class="field">
      <span class="lbl">${t === 'sakit' ? 'Foto surat dokter' : 'Foto pendukung'} (opsional, maks. 3)</span>
      <input id="fi" type="file" accept="image/*" multiple hidden onchange="addPh(this)">
      <button type="button" class="ghost" onclick="$('#fi').click()">Unggah foto</button>
      <div class="thumbs">${V.photos.map((p, i) => `<div><img src="${p}" alt="Foto ${i + 1}"><button type="button" onclick="rmPh(${i})" aria-label="Hapus foto">×</button></div>`).join('')}</div>
    </div>
    <button class="btn">Kirim ke Team Leader</button>
  </form>`;
}

async function send(e) {
  e.preventDefault();
  const g = (n) => e.target.elements[n]?.value;
  const t = V.type;
  const body = {
    type: t,
    from: g('from'),
    to: g('to') || g('from'),
    shift: g('shift'),
    partner: g('partner'),
    note: g('note'),
    photos: V.photos,
  };
  if (t === 'tukar' && body.from === body.to) return toast('Tanggal pengganti harus berbeda dari tanggal yang ditukar');
  try {
    await api('requests', body);
    toast('Pengajuan terkirim ke Team Leader');
    V.photos = [];
    V.note = '';
    V.tab = 'list';
    await load();
  } catch (x) {
    toast(x.message);
  }
}

/* ---------- Foto ---------- */
function shrink(f) {
  return new Promise((ok, no) => {
    const im = new Image(), url = URL.createObjectURL(f);
    im.onload = () => {
      const k = Math.min(1, 1100 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => no(new Error('Foto tidak bisa dibaca'));
    im.src = url;
  });
}
async function addPh(el) {
  for (const f of [...el.files]) {
    if (V.photos.length >= 3) { toast('Maksimal 3 foto'); break; }
    try { V.photos.push(await shrink(f)); } catch (x) { toast(x.message); }
  }
  el.value = '';
  render();
}
function rmPh(i) { V.photos.splice(i, 1); render(); }

async function showPh(id) {
  try {
    const p = await api('photos/' + id);
    const o = document.createElement('div');
    o.id = 'ov';
    o.onclick = () => o.remove();
    o.innerHTML = p.map((x) => `<img src="${x}" alt="Foto pengajuan">`).join('') +
      `<p class="ovw">${esc(S.user.name)} · Ops ${esc(S.user.ops || S.user.id)} · Ketuk untuk menutup</p>`;
    document.body.appendChild(o);
  } catch (x) { toast(x.message); }
}

/* ---------- Riwayat ---------- */
function reqCard(r) {
  const [lbl, cls] = ST[r.status] || [r.status, ''];
  return `<article class="item ${cls}">
    <div class="row1">
      <div><h3>${T[r.type]}</h3><div class="meta">${when(r)}</div></div>
      <span class="st ${cls}">${lbl}</span>
    </div>
    <div class="meta" style="margin-top:6px">${shiftTag(r.shift)}${r.partner ? (r.shift ? ' · ' : '') + 'Rekan: ' + esc(r.partner) : ''}</div>
    <p>${esc(r.note)}</p>
    ${r.photos ? `<button class="ghost sm" onclick="showPh('${r.id}')">Lihat ${r.photos} foto</button>` : ''}
    ${r.log.map((l) => `<div class="log">${esc(l.by)} ${ACT[l.action]}${l.note ? ' — ' + esc(l.note) : ''}</div>`).join('')}
  </article>`;
}
function viewList() {
  return `<h2>Riwayat pengajuan</h2>${V.reqs.length ? V.reqs.map(reqCard).join('') : '<div class="empty">Belum ada pengajuan. Mulai dari tab Ajukan.</div>'}`;
}

/* ---------- Kerangka ---------- */
function render() {
  const u = S.user;
  if (!u) { $('#app').innerHTML = viewLogin(); return; }
  const tabs = [['form', 'Ajukan'], ['list', 'Riwayat']];
  $('#app').innerHTML = `
    <header class="top">
      <div><b>${esc(u.name)}</b><small>Ops ${esc(u.ops || '-')} · ${ROLE[u.role] || u.role}</small></div>
      <div class="acts">
        ${BACKEND_ROLES.includes(u.role) ? '<a class="ghost sm" href="/backend/">Backend</a>' : ''}
        <button class="ghost sm" onclick="logout()">Keluar</button>
      </div>
    </header>
    <main>${V.tab === 'form' ? viewForm() : viewList()}</main>
    <nav class="tabs">${tabs.map(([k, n]) => `<button class="${V.tab === k ? 'on' : ''}" onclick="go('${k}')">${n}</button>`).join('')}</nav>`;
  watermark(u);
}

function go(k) {
  V.tab = k;
  if (k === 'list') load(); else render();
}

async function load() {
  try { V.reqs = (await api('requests?scope=mine')).requests; } catch (x) { toast(x.message); }
  render();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
S.user ? load() : render();
</script>
</body>
</html>
