<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EE4D2D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Palangka Raya DC · Backend</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
const { S, $, esc, fd, today, shiftTag, when, toast, api, download, saveSession, logout, watermark, t, typeName, stLabel, actLabel, roleName, prefsBar, SH, ST_CLS, BACKEND_ROLES } = App;

const TABS = ['todo', 'all', 'rekap', 'sched', 'users'];
const TAB_LABEL = { todo: 'tab_queue', all: 'tab_all', rekap: 'tab_recap', sched: 'tab_sched', users: 'tab_users' };
const V = { tab: 'todo', reqs: [], users: null, sched: [], month: today().slice(0, 7), q: '' };

/* ---------- Login ---------- */
function viewLogin() {
  return `<section class="auth">
    <div class="auth-top">${prefsBar()}</div>
    <div class="brand-mark">PKY</div>
    <h1>${t('app_name')} · ${t('backend')}</h1>
    <form class="sheet" onsubmit="doLogin(event)">
      <p class="meta">${t('login_sub_be')}</p>
      <label>${t('login_id')}<input name="login" autocomplete="username" autocapitalize="characters" required></label>
      <label>${t('password')}<input name="pin" type="password" autocomplete="current-password" required></label>
      <button class="btn">${t('login_btn')}</button>
    </form></section>`;
}

async function doLogin(e) {
  e.preventDefault();
  const g = (n) => e.target.elements[n].value;
  try {
    const d = await api('login', { id: g('login').trim(), pin: g('pin') });
    if (!BACKEND_ROLES.includes(d.user.role)) throw new Error(t('err_no_access'));
    saveSession(d.token, d.user);
    V.tab = 'todo';
    await load();
  } catch (x) { toast(x.message); }
}

/* ---------- Antrian & semua pengajuan ---------- */
function isTodo(r) {
  const u = S.user;
  if (u.role === 'tl') return r.status === 'menunggu_tl';
  if (u.role === 'admin') return r.status === 'disetujui_tl';
  if (u.role === 'superadmin') return ['menunggu_tl', 'disetujui_tl'].includes(r.status);
  return false;
}

function card(r) {
  const cls = ST_CLS[r.status] || '';
  const u = S.user;
  const tlCan = r.status === 'menunggu_tl' && (u.role === 'tl' || u.role === 'superadmin');
  const admCan = r.status === 'disetujui_tl' && (u.role === 'admin' || u.role === 'superadmin');
  const btn = tlCan ? ['approve', 'reject', t('btn_approve'), t('btn_reject')]
    : admCan ? ['check', 'return', t('btn_check'), t('btn_return')] : null;
  return `<article class="item ${cls}">
    <div class="row1">
      <div><h3>${typeName(r.type)} · ${esc(r.name)}</h3>
        <div class="meta">Ops ${esc(r.ops || '-')} · ${when(r)}</div></div>
      <span class="st ${cls}">${stLabel(r.status)}</span>
    </div>
    ${r.shift ? `<div class="meta" style="margin-top:6px">${shiftTag(r.shift)}</div>` : ''}
    <p>${esc(r.note)}</p>
    ${r.photos ? `<button class="ghost sm" onclick="showPh('${r.id}')">${t('view_photos', { n: r.photos })}</button>` : ''}
    ${r.log.map((l) => `<div class="log">${esc(l.by)} ${actLabel(l.action)}${l.note ? ' — ' + esc(l.note) : ''}</div>`).join('')}
    ${btn ? `<div class="act">
      <input id="n${r.id}" placeholder="${t('note_required')}">
      <div class="row">
        <button class="btn sm" onclick="act('${r.id}','${btn[0]}')">${btn[2]}</button>
        <button class="btn sm danger" onclick="act('${r.id}','${btn[1]}')">${btn[3]}</button>
      </div></div>` : ''}
  </article>`;
}

async function act(id, a) {
  const note = document.getElementById('n' + id)?.value || '';
  if (['reject', 'return'].includes(a) && !note.trim()) return toast(t('note_needed'));
  try {
    await api('act', { id, action: a, note });
    toast(t('toast_saved'));
    await load();
  } catch (x) { toast(x.message); }
}

function matchQ(r, q) {
  if (!q) return true;
  const hay = [r.name, r.ops, r.uid, typeName(r.type), r.note, stLabel(r.status), r.from, r.to].filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}
function listAll() {
  const l = V.reqs.filter((r) => matchQ(r, V.q));
  return l.length ? l.map(card).join('') : `<div class="empty">${t('empty_search')}</div>`;
}
function viewTodo() {
  const l = V.reqs.filter(isTodo);
  return `<h2>${t('queue_title')}</h2>${l.length ? l.map(card).join('') : `<div class="empty">${t('empty_queue')}</div>`}`;
}
function viewAll() {
  return `<h2>${t('all_title')}</h2>
  <input type="search" placeholder="${t('search_ph')}" value="${esc(V.q)}" oninput="V.q=this.value;document.getElementById('listAll').innerHTML=listAll()" style="margin-bottom:12px">
  <div id="listAll">${V.reqs.length ? listAll() : `<div class="empty">${t('empty_all')}</div>`}</div>`;
}

/* ---------- Jadwal (unggah & hapus) ---------- */
function viewSched() {
  return `<h2>${t('sched_head')}</h2>
  <form class="sheet" onsubmit="uploadSched(event)">
    <h3>${t('sched_upload')}</h3>
    <label>${t('sched_title')}<input name="title" required></label>
    <label>${t('sched_file')}<input name="file" type="file" accept="application/pdf,image/*" required></label>
    <button class="btn">${t('btn_upload')}</button>
  </form>
  ${V.sched.length ? V.sched.map((s) => `<article class="item" style="margin-top:10px">
      <div class="row1"><div><h3>${esc(s.title)}</h3><div class="meta">${esc(s.name)} · ${t('uploaded_on')} ${fd(s.created.slice(0, 10))} ${t('by')} ${esc(s.by || '-')}</div></div></div>
      <div class="row" style="margin-top:10px">
        <button class="ghost sm" data-id="${s.id}" data-name="${esc(s.name)}" onclick="dl(this)">${t('btn_download')}</button>
        <button class="btn sm danger" data-id="${s.id}" onclick="delSched(this)">${t('btn_delete')}</button>
      </div></article>`).join('') : `<div class="empty">${t('sched_empty')}</div>`}`;
}

function readDataUrl(file) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => no(new Error('File tidak bisa dibaca'));
    r.readAsDataURL(file);
  });
}

async function uploadSched(e) {
  e.preventDefault();
  const f = e.target;
  const file = f.elements.file.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) return toast(t('err_file_big'));
  try {
    const data = await readDataUrl(file);
    await api('jadwal', { title: f.elements.title.value.trim(), name: file.name, mime: file.type, data });
    toast(t('sched_ok'));
    V.sched = (await api('jadwal')).items;
    render();
  } catch (x) { toast(x.message); }
}

async function delSched(el) {
  if (!confirm(t('sched_confirm'))) return;
  try {
    await api('jadwal/' + encodeURIComponent(el.dataset.id), null, { method: 'DELETE' });
    toast(t('sched_deleted'));
    V.sched = (await api('jadwal')).items;
    render();
  } catch (x) { toast(x.message); }
}

async function dl(el) {
  try { await download(el.dataset.id, el.dataset.name); toast(t('toast_downloaded')); }
  catch (x) { toast(x.message); }
}

/* ---------- Foto ---------- */
async function showPh(id) {
  try {
    const p = await api('photos/' + id);
    if (!p.length) return toast(t('no_photo'));
    const o = document.createElement('div');
    o.id = 'ov';
    o.onclick = () => o.remove();
    o.innerHTML = p.map((x) => `<img src="${x}" alt="">`).join('') +
      `<p class="ovw">${esc(S.user.name)} · Ops ${esc(S.user.ops || S.user.id)} · ${t('close_hint')}</p>`;
    document.body.appendChild(o);
  } catch (x) { toast(x.message); }
}

/* ---------- Rekap & ekspor ---------- */
function viewRekap() {
  const [Y, M] = V.month.split('-').map(Number), n = new Date(Y, M, 0).getDate();
  const SHIFT_K = ['sakit', 'izin'];
  const nm = { cuti: typeName('cuti'), sakit: typeName('sakit'), izin: typeName('izin') };
  const A = {}, tot = { 1: {}, 2: {}, 3: {} }, cutiAll = { hari: 0 };
  V.reqs.filter((r) => ['cuti', 'sakit', 'izin'].includes(r.type) && !['ditolak_tl', 'dikembalikan'].includes(r.status))
    .forEach((r) => {
      for (let d = 1; d <= n; d++) {
        const ds = `${V.month}-${String(d).padStart(2, '0')}`;
        if (ds < r.from || ds > r.to) continue;
        A[ds] = A[ds] || { shift: {}, cuti: 0 };
        if (r.type === 'cuti') { A[ds].cuti++; cutiAll.hari++; continue; }
        if (!r.shift) continue;
        A[ds].shift[r.shift] = A[ds].shift[r.shift] || {};
        A[ds].shift[r.shift][r.type] = (A[ds].shift[r.shift][r.type] || 0) + 1;
        tot[r.shift][r.type] = (tot[r.shift][r.type] || 0) + 1;
      }
    });
  const dom = (c) => (c ? Object.entries(c).sort((a, b) => b[1] - a[1])[0] : null);
  const cell = (c) => { const d = dom(c); return d ? `<span class="t-${d[0]}">${nm[d[0]]} ${d[1]}</span>` : '–'; };
  const rows = Object.keys(A).sort().map((ds) => `<tr><td>${fd(ds)}</td>${[1, 2, 3].map((s) => `<td>${cell(A[ds].shift[s])}</td>`).join('')}<td>${A[ds].cuti ? `<span class="t-cuti">${nm.cuti} ${A[ds].cuti}</span>` : '–'}</td></tr>`).join('');

  return `<h2>${t('rekap_title')}</h2>
  <label style="margin-top:0">${t('month')}<input type="month" value="${V.month}" onchange="V.month=this.value;render()"></label>
  <div class="row" style="margin:12px 0 16px">
    <button class="ghost sm" onclick="exp(V.month)">${t('export_month')}</button>
    <button class="ghost sm" onclick="exp('all')">${t('export_all')}</button>
  </div>
  <p class="meta">${t('recap_note')}</p>
  <div class="grid3" style="margin-top:12px">${[1, 2, 3].map((s) => {
    const tt = tot[s] || {}, sum = SHIFT_K.reduce((a, k) => a + (tt[k] || 0), 0), d = dom(tt);
    return `<div class="sheet" style="margin-top:0"><div>${shiftTag(s)}</div>
      <div class="big ${d ? 't-' + d[0] : ''}">${d ? nm[d[0]] : t('recap_none')}</div>
      <div class="meta">${sum} ${t('hari_orang')}</div>
      <div class="bar">${SHIFT_K.map((k) => `<i style="width:${sum ? (tt[k] || 0) / sum * 100 : 0}%;background:var(--${k === 'sakit' ? 'wait' : 'info'})"></i>`).join('')}</div>
      <div class="meta">${SHIFT_K.map((k) => `${nm[k]} ${tt[k] || 0}`).join(' · ')}</div></div>`;
  }).join('')}
  <div class="sheet" style="margin-top:0"><div class="sh">${nm.cuti}</div>
      <div class="big t-cuti">${cutiAll.hari} ${t('hari_orang')}</div>
      <div class="meta">${t('cuti_per_hari')}</div></div></div>
  <div class="sheet"><h3>${t('per_tanggal')}</h3><div class="tbl">${rows
    ? `<table><tr><th>${t('date_col')}</th><th>${t('shift')} 1</th><th>${t('shift')} 2</th><th>${t('shift')} 3</th><th>${nm.cuti}</th></tr>${rows}</table>`
    : `<div class="empty">${t('recap_nodata')}</div>`}</div></div>`;
}

async function exp(m) {
  try {
    const r = await fetch('/api/export?month=' + encodeURIComponent(m), { headers: { authorization: 'Bearer ' + S.tok } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Gagal ekspor');
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = `rekap-pengajuan-${m}.xlsx`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(t('toast_recap'));
  } catch (x) { toast(x.message); }
}

/* ---------- Pengguna (sumber: spreadsheet, hanya baca) ---------- */
function viewUsers() {
  const us = V.users || [];
  return `<h2>${t('tab_users')}</h2>
  <p class="meta">${t('users_note')}</p>
  <div class="sheet">${us.length ? us.map((x) => `<div style="padding:10px 0;border-bottom:1px solid var(--rule)">
      <b>${esc(x.name)}</b> <span class="meta">${esc(x.id)} · ${roleName(x.role)}${x.active ? '' : ' · <span style="color:var(--bad)">' + t('nonaktif') + '</span>'}</span>
    </div>`).join('') : `<div class="empty">${t('no_data')}</div>`}</div>`;
}

/* ---------- Kerangka ---------- */
function render() {
  const u = S.user;
  if (!u) { $('#app').innerHTML = viewLogin(); return; }
  const count = V.reqs.filter(isTodo).length;
  const body = V.tab === 'todo' ? viewTodo() : V.tab === 'all' ? viewAll() : V.tab === 'rekap' ? viewRekap() : V.tab === 'sched' ? viewSched() : viewUsers();
  const items = TABS.map((k) => ({ k, label: t(TAB_LABEL[k]), badge: k === 'todo' ? count : 0 }));
  $('#app').innerHTML = App.shell({ u, items, active: V.tab, badge: count, link: { href: '/', label: t('frontend') } }) +
    `<main>${body}</main>`;
  watermark(u);
}

async function go(k) {
  V.tab = k;
  if (k === 'users' && !V.users) {
    try { V.users = (await api('users')).users; } catch (x) { toast(x.message); }
  }
  if (k === 'sched') {
    try { V.sched = (await api('jadwal')).items; } catch (x) { toast(x.message); }
  }
  render();
}

async function load() {
  try { V.reqs = (await api('requests?scope=team')).requests; } catch (x) { toast(x.message); }
  render();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
S.user ? load() : render();
</script>
</body>
</html>
